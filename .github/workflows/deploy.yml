name: Deploy to GitHub Pages

# Deploys the client demo to gh-pages. Whichever run finishes last is what's live.
# - Push to main or redesign/home-seo deploys that branch.
# - Rollback to main: Actions > open the last successful run on main > "Re-run all jobs".
# - workflow_dispatch adds a "Run workflow" button once this file is on the default branch.
on:
  push:
    branches: [ main, redesign/home-seo ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build (predeploy)
        run: npm run predeploy

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/bain-et-cuisine/browser
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
